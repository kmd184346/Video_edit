services:
  - type: web
    name: neonclipping
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NEONCLIPPING_DATA_DIR
        value: /tmp/neonclipping-data
      - key: NEONCLIPPING_PUBLIC
        value: '1'
